[package]
name = "nc-code-workflow"
version = "3.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native dynamic-workflow engine: deterministic state machine, journal, Node sandbox bridge, compile kernel client and driver ports (specs/workflow-capability-boundary.md)"

[lib]
name = "nc_code_workflow"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util = "0.3"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
oxc_parser = "0.52"
oxc_ast = "0.52"
oxc_span = "0.52"
oxc_allocator = "0.52"
oxc_diagnostics = "0.52"

[dev-dependencies]
tempfile = "3"
