[package]
name = "nc-code-services-git-checkpoint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "git-checkpoint channel: immutable workspace file snapshots (temp index -> hidden commit -> hidden ref) with three-way conflict-checked restore"

[dependencies]
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
nc-code-channels = { path = "../nc-code-channels" }
nc-code-rpc = { path = "../nc-code-rpc" }
nc-code-service-core = { path = "../nc-code-service-core" }
# line_stats_from_contents uses the shared diff engine (jsdiff@9 equivalent implementation, no need to write a second set by yourself).
nc-code-diff = { path = "../nc-code-diff" }
# There is only one warehouse parsing (rev-parse --show-toplevel/prefix), checkpoint no longer comes with a second set of parsing.
nc-code-services-git = { path = "../nc-code-services-git" }