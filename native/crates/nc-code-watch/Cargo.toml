[package]
name = "nc-code-watch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "File-watch sidecar island mirroring packages/services/src/fileWatcher/fileWatcherService.ts over the sidecar stdio protocol"

[[bin]]
name = "zcode-watch"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
nc-code-sidecar-proto = { path = "../nc-code-sidecar-proto" }
notify = "8"

[dev-dependencies]
tempfile = "3"
