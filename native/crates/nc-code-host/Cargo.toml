[package]
name = "nc-code-host"
version = "3.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "S3 Rust agent host: stdio v4 NDJSON RPC surface with in-process command admission, conversation projection, delivery profiles and provider execution"

[lib]
name = "nc_code_host"
path = "src/lib.rs"

[[bin]]
name = "zcode-host"
path = "src/main.rs"

[[bench]]
name = "transcript_replay"
harness = false

[[bench]]
name = "file_rewind"
harness = false

[[bench]]
name = "goal_domain"
harness = false

[[bench]]
name = "workspace_hooks"
harness = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
serde_yaml = "0.9"
regex = "1"
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
  "gzip",
] }
nc-code-core = { path = "../nc-code-core" }
nc-code-v4-wire = { path = "../nc-code-v4-wire" }
nc-code-provider = { path = "../nc-code-provider" }
nc-code-scan = { path = "../nc-code-scan" }
nc-code-proc = { path = "../nc-code-proc" }
nc-code-workflow = { path = "../nc-code-workflow" }
nc-code-node-repl = { path = "../nc-code-node-repl" }
# nc-tools：以 crate 形式**进程内直接链接**（不是 MCP server、不是 sidecar）。
# 它的 89 个 typed 工具通过 Kernel 注册表进入 host 的工具面。
nct-mcp = { path = "G:/nc-sdk/nc-tools/crates/nct-mcp" }
nct-core = { path = "G:/nc-sdk/nc-tools/crates/nct-core" }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
