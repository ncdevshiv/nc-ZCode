[package]
name = "nc-code-services-file-watcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "file-watcher service channel: real filesystem watching via notify"

[dependencies]
serde.workspace = true
async-trait = "0.1"
notify = "8"
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
nc-code-channels = { path = "../nc-code-channels" }
nc-code-rpc = { path = "../nc-code-rpc" }
nc-code-service-core = { path = "../nc-code-service-core" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "time", "fs"] }
