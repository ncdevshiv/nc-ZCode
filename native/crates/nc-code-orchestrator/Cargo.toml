[package]
name = "nc-code-orchestrator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NC-AG autonomous multi-agent orchestration platform: planner, DAG scheduler, agent runtime, leases, durable messaging, git integration, decisions, audit (specs/nc-ag-orchestration.md)"

[lib]
name = "nc_code_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "zcode-ncag"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
nc-code-provider = { path = "../nc-code-provider" }
nc-code-service-core = { path = "../nc-code-service-core" }
nc-code-services-provider = { path = "../nc-code-services-provider" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
