[package]
name = "zcode-shell"
version = "3.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri 2 desktop shell scaffold (S4): IPlatformService-shaped command surface, tray, scaffold dist page (packages/web wiring spec-gated OPEN)"

[[bin]]
name = "zcode-shell"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
serde_json.workspace = true
