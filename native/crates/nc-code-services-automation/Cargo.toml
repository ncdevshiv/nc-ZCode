[package]
name = "nc-code-services-automation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Automation (cron / scheduled task) service: tasks-index.sqlite repository, nc-code-agent-equivalent RPC surface and the claim→dispatch→settle scheduler with backoff"

[dependencies]
async-trait = "0.1"
# Only use clock + std: cron / scheduleRule for local time zone to trigger calculation next (aligned with TS Date local calendar semantics).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Exactly the same version as nc-code-host, ensure that the Connection type returned by `zcode_host::storage::open` is interoperable.
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
nc-code-channels = { path = "../nc-code-channels" }
nc-code-host = { path = "../nc-code-host" }
nc-code-rpc = { path = "../nc-code-rpc" }
nc-code-service-core = { path = "../nc-code-service-core" }
