[package]
name = "nc-code-shell"
version = "3.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri 2 desktop shell: IPlatformService-shaped command surface, tray, embedded Rust backend, native dialogs/clipboard/notifications/deep links, saveFile, zoom, Windows print-to-pdf, and remote-target discovery"

[[bin]]
name = "zcode-shell"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
aes-gcm = "0.10"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.13"
sha1 = "0.11"
time = "0.3"
base64 = "0.22"
nc-code-cdp = { path = "../nc-code-cdp" }
nc-code-host = { path = "../nc-code-host" }
async-trait = "0.1"
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio.workspace = true
nc-code-app = { path = "../nc-code-app" }
nc-code-server = { path = "../nc-code-server" }
nc-code-orchestrator = { path = "../nc-code-orchestrator" }
nc-code-service-core = { path = "../nc-code-service-core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Power", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }
objc2-core-foundation = { version = "0.3", features = ["alloc"] }
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "WKPDFConfiguration", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }

[dev-dependencies]
serde_json.workspace = true
