[package]
name = "zcode-server"
version = "3.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "axum mirror of packages/server (S5): static UI + SPA fallback, health endpoints, HostPort seam"

[lib]
name = "zcode_server"
path = "src/lib.rs"

[[bin]]
name = "zcode-server"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
