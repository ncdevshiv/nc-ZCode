version: 1

# The existing modules are first marked as legacy; new modules or modules that have completed migration are set to managed: true.
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

# Language boundary: TypeScript only exists on the front end. Spec source specs/typescript-frontend-only.md.
# Ratchet baseline is in .architecture-ts-baseline.json, generated by bun run architecture:ts-baseline:update.
# Store the baseline separately from the module rules so that baseline:update cannot easily clean up the new language debt.
languageBoundary:
  id: ts-frontend-only
  # Determine the extension. The non-inclusion of JS/MJS is a matter of record pending decision (spec §8.1), not an omission.
  extensions: [.ts, .tsx, .mts, .cts]
  allowlist:
    - id: frontend-webview
      kind: frontend
      roots:
        - packages/ui
        - packages/web
        - packages/desktop/src/renderer
        - packages/desktop/src/preload
    - id: dev-tooling
      kind: dev-tooling
      roots: [.agents/skills, scripts, harness, packages/desktop/scripts]
    - id: dev-tooling-entry
      kind: dev-tooling
      files: [packages/server/build-remote.ts]
    - id: dev-tooling-config
      kind: dev-tooling
      patterns: ["**/*.config.ts", "**/*.d.ts", "**/*.d.mts"]
  # Non-allowlist TS must not rely on dev-tooling, otherwise the allow list will degenerate into a parking lot for back-end TS.
  forbidDevToolingImports: true
  # Escape cabin: Write it into the warehouse, go through code review, and you must bring
  # the expiration date. The two workflow fixtures are frozen TypeScript inputs for the
  # two-runtime compile/parity tests; the compiler must read real TS source, not a rewritten
  # copy, and they are not product code.
  escapeHatches:
    - id: workflow-compile-fixtures
      reason: >-
        Frozen TypeScript workflow scripts are the input corpus for the two-runtime
        compile/parity tests (`workflow_linear` / `workflow_fanout`); the compile
        kernel and the parity fixtures must read real TS source, not a rewritten copy.
      approvedBy: "main (native port verification, 2026-11-03)"
      expires: "2026-12-31"
      paths:
        - native/crates/nc-code-workflow/tests/fixtures/workflow_linear.ts
        - native/crates/nc-code-workflow/tests/fixtures/workflow_fanout.ts

exceptions: []
